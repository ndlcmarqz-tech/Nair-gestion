<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#87967c"><title>Nair de la Cruz · Gestión</title>
<style>
body{margin:0;background:#f7f2eb;color:#443f3a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding-bottom:80px}.top{padding:28px 20px;background:#eee7dd}.brand{letter-spacing:2px;text-transform:uppercase;font-size:12px;color:#6f8067}h1,h2{font-family:Georgia,serif;font-weight:500}main{padding:16px}.card,.metric{background:#fffdf9;border:1px solid #e8dfd5;border-radius:18px;padding:16px;margin-bottom:12px}.goal{font-size:30px;font-weight:700}.small{font-size:13px;color:#81786f}.bar{height:10px;background:#eee7df;border-radius:20px;overflow:hidden;margin:12px 0}.fill{height:100%;background:#87967c}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric b{display:block;font-size:24px;margin-top:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}button{border:0;border-radius:13px;padding:13px;background:#87967c;color:white;font-weight:650}button.alt{background:#eee6dc;color:#443f3a}.item{padding:12px 0;border-bottom:1px solid #e8dfd5;display:flex;justify-content:space-between}.item:last-child{border:0}.tag{background:#eee7df;padding:5px 8px;border-radius:20px;font-size:11px}nav{position:fixed;bottom:0;left:0;right:0;background:#fffdf9;border-top:1px solid #e8dfd5}nav div{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}nav button{background:none;color:#81786f;border-radius:0;font-size:11px}.modal{display:none;position:fixed;inset:0;background:#0005;align-items:flex-end}.sheet{background:#f7f2eb;width:100%;max-width:720px;margin:auto;padding:20px;border-radius:22px 22px 0 0}label{display:block;font-size:12px;color:#81786f;margin:10px 0 5px}input,select{width:100%;padding:12px;border:1px solid #e8dfd5;border-radius:11px;box-sizing:border-box;background:white;font-size:15px}.close{margin-top:8px;background:#eee6dc;color:#443f3a;width:100%}
</style></head><body><div class="app"><header class="top"><div class="brand">Estudio</div><h1>Nair de la Cruz</h1><div class="small">Gestión comercial</div></header><main id="app"></main><nav><div><button onclick="page('home')">⌂<br>Inicio</button><button onclick="page('agenda')">◷<br>Agenda</button><button onclick="page('clients')">♙<br>Clientas</button><button onclick="page('leads')">♡<br>Consultas</button><button onclick="page('results')">▥<br>Resultados</button></div></nav></div>
<div class="modal" id="modal"><div class="sheet"><h2 id="mt"></h2><div id="mb"></div></div></div>
<script>
const K="nair_v1",P={Lavado:25000,Corte:30000,"Color completo":50000,"Mechas / reflejos":80000,Alisado:70000,Cauterizado:50000,"Tratamiento Plex":75000,"Semi de Lino":75000};
let d=JSON.parse(localStorage.getItem(K)||'{"clients":[],"appointments":[],"leads":[],"sales":[]}');
const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10),money=n=>"$"+Number(n).toLocaleString("es-AR"),fmt=x=>new Date(x+"T12:00").toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"});
function save(){localStorage.setItem(K,JSON.stringify(d))}function page(p){({home,agenda,clients,leads,results}[p])()}
function home(){let m=today().slice(0,7),s=d.sales.filter(x=>x.date.startsWith(m)),r=s.reduce((a,x)=>a+x.price,0),q=Math.min(100,s.length/46*100);$("app").innerHTML=`<div class="card"><div class="small">OBJETIVO MENSUAL</div><div class="goal">${s.length} <span class="small">/ 46 clientas</span></div><div class="bar"><div class="fill" style="width:${q}%"></div></div><div class="small">Facturación registrada: <b>${money(r)}</b></div></div><div class="actions"><button onclick="attention()">＋ Atención</button><button onclick="appointment()">＋ Turno</button><button onclick="lead()">＋ Consulta</button><button class="alt" onclick="client()">＋ Clienta</button></div><div class="grid"><div class="metric"><span class="small">Consultas</span><b>${d.leads.length}</b></div><div class="metric"><span class="small">Turnos</span><b>${d.appointments.filter(x=>x.date>=today()).length}</b></div><div class="metric"><span class="small">Clientas</span><b>${d.clients.length}</b></div><div class="metric"><span class="small">Ingresos</span><b>${money(r)}</b></div></div><h2>Próximos turnos</h2><div class="card">${upcoming()}</div>`}
function upcoming(){let a=d.appointments.filter(x=>x.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);return a.length?a.map(x=>`<div class="item"><div><b>${x.client}</b><br><span class="small">${fmt(x.date)} · ${x.time} · ${x.service}</span></div><span class="tag">${x.status}</span></div>`).join(""):"<div class='small'>No hay turnos cargados.</div>"}
function agenda(){let a=d.appointments.filter(x=>x.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$("app").innerHTML=`<h2>Agenda</h2><button onclick="appointment()">＋ Nuevo turno</button><div class="card" style="margin-top:12px">${a.length?a.map(x=>`<div class="item"><div><b>${x.client}</b><br><span class="small">${fmt(x.date)} · ${x.time}<br>${x.service}</span></div><span class="tag">${x.status}</span></div>`).join(""):"<div class='small'>No hay turnos próximos.</div>"}</div>`}
function clients(){$("app").innerHTML=`<h2>Clientas</h2><button onclick="client()">＋ Nueva clienta</button><div class="card" style="margin-top:12px">${d.clients.length?d.clients.map((x,i)=>`<div class="item"><div><b>${x.name}</b><br><span class="small">${x.phone||"Sin WhatsApp"} · ${x.service||"Sin servicio"}</span></div><span class="tag" onclick="delClient(${i})">Eliminar</span></div>`).join(""):"<div class='small'>Todavía no hay clientas.</div>"}</div>`}
function leads(){$("app").innerHTML=`<h2>Consultas</h2><button onclick="lead()">＋ Nueva consulta</button><div class="card" style="margin-top:12px">${d.leads.length?d.leads.slice().reverse().map(x=>`<div class="item"><div><b>${x.name}</b><br><span class="small">${x.channel} · ${x.need||"Consulta"} · ${fmt(x.date)}</span></div><span class="tag">${x.status}</span></div>`).join(""):"<div class='small'>Registrá las consultas para no perder oportunidades.</div>"}</div>`}
function results(){let m=today().slice(0,7),s=d.sales.filter(x=>x.date.startsWith(m)),r=s.reduce((a,x)=>a+x.price,0),avg=s.length?r/s.length:0;$("app").innerHTML=`<h2>Resultados del mes</h2><div class="grid"><div class="metric"><span class="small">Atendidas</span><b>${s.length}</b></div><div class="metric"><span class="small">Objetivo</span><b>46</b></div><div class="metric"><span class="small">Ingresos</span><b>${money(r)}</b></div><div class="metric"><span class="small">Ticket promedio</span><b>${money(avg)}</b></div></div><div class="card">${s.length?s.map(x=>`<div class="item"><b>${x.service}</b><span>${money(x.price)}</span></div>`).join(""):"<div class='small'>Todavía no hay atenciones registradas.</div>"}</div>`}
function modal(t,b){$("mt").textContent=t;$("mb").innerHTML=b;$("modal").style.display="flex"}function close(){ $("modal").style.display="none"}function done(){save();close();home()}
function client(){modal("Nueva clienta",`<label>Nombre</label><input id="cn"><label>WhatsApp</label><input id="cp"><label>Servicio habitual</label><select id="cs"><option value="">Seleccionar</option>${Object.keys(P).map(x=>`<option>${x}</option>`).join("")}</select><br><br><button onclick="addClient()">Guardar</button><button class="close" onclick="close()">Cancelar</button>`)}
function addClient(){if(!cn.value.trim())return alert("Ingresá el nombre");d.clients.push({name:cn.value.trim(),phone:cp.value,service:cs.value});done()}function delClient(i){if(confirm("¿Eliminar esta clienta?")){d.clients.splice(i,1);save();clients()}}
function appointment(){modal("Nuevo turno",`<label>Clienta</label><input id="an"><label>Fecha y hora</label><div class="grid"><input id="ad" type="date" value="${today()}"><input id="at" type="time" value="10:00"></div><label>Servicio</label><select id="as">${Object.keys(P).map(x=>`<option>${x}</option>`).join("")}</select><label>Estado</label><select id="ax"><option
